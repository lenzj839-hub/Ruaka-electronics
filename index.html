<script>
var chatBox = document.getElementById('chat');
var memName = ""; var memAppliance = ""; var memProblem = ""; var memLocation = "";
try{ var s = localStorage.getItem('ruaka_mem_simple'); if(s){ var o = JSON.parse(s); memName=o.name||""; memAppliance=o.appliance||""; memProblem=o.problem||""; memLocation=o.location||""; } }catch(e){}
function saveMem(){ try{ localStorage.setItem('ruaka_mem_simple', JSON.stringify({name:memName,appliance:memAppliance,problem:memProblem,location:memLocation})); }catch(e){} }
function showMsg(text, who){ var d=document.createElement('div'); d.className='msg '+who; d.innerHTML=text; chatBox.appendChild(d); chatBox.scrollTop=chatBox.scrollHeight; }
function clearChat(){ try{ localStorage.removeItem('ruaka_mem_simple'); }catch(e){} memName=""; memAppliance=""; memProblem=""; memLocation=""; chatBox.innerHTML=""; showMsg("Hello again! How can I help you today? Tell me what is broken.",'bot'); }
function quickBook(dev){ var sel=document.getElementById('device'); if(sel) sel.value=dev; var b=document.getElementById('book'); if(b) b.scrollIntoView({behavior:'smooth'}); }
function hasWord(text, words){ var low=" "+text.toLowerCase().replace(/[^a-z0-9 ]/g," ")+" "; for(var i=0;i<words.length;i++){ if(low.indexOf(" "+words[i]+" ")!==-1) return true; } return false; }
function hasPhrase(text, phrase){ return text.toLowerCase().indexOf(phrase)!==-1; }
function toTech(appliance){
  var msg = "Hi Ruaka Electronics! I need help with my " + (appliance || "appliance") + ".";
  if(memProblem) msg += " Problem: " + memProblem;
  if(memName) msg += " Name: " + memName;
  if(memLocation) msg += " Location: " + memLocation;
  return "<br><br><a href='https://wa.me/254797300175?text=" + encodeURIComponent(msg) + "' style='display:inline-block;background:#25D366;color:#fff;padding:10px 14px;border-radius:8px;font-weight:bold;text-decoration:none'>Chat Technician on WhatsApp →</a> Or call <b>0797 300 175</b>";
}
function detectAppliance(q,l){
  if(hasPhrase(l,'car radio')||hasPhrase(l,'car stereo')) return 'Car Radio';
  if(hasPhrase(l,'home theatre')||hasPhrase(l,'home theater')||hasPhrase(l,'sound system')) return 'Home Theatre';
  if(hasWord(l,['computer','laptop','pc','desktop','macbook'])) return 'Computer / Laptop';
  if(hasWord(l,['amplifier','amp','woofer','subwoofer','speaker','bass'])) return 'Woofer / Amplifier';
  if(hasWord(l,['tv','television'])) return 'TV';
  if(hasWord(l,['microwave'])) return 'Microwave';
  if(hasWord(l,['fridge','freezer'])) return 'Fridge';
  if(hasWord(l,['washing','washer'])) return 'Washing Machine';
  if(hasWord(l,['cooker','stove','hotplate','oven'])) return 'Cooker / Oven';
  if(hasWord(l,['radio','stereo'])) return 'Radio';
  if(hasWord(l,['decoder','dstv','startimes','zuku','gotv'])) return 'Decoder';
  if(hasWord(l,['blender'])) return 'Blender';
  if(hasWord(l,['iron'])) return 'Iron';
  if(hasWord(l,['fan'])) return 'Fan';
  if(hasWord(l,['kettle'])) return 'Kettle';
  if(hasWord(l,['toaster'])) return 'Toaster';
  if(hasWord(l,['phone'])) return 'Phone';
  if(hasWord(l,['printer'])) return 'Printer';
  if(hasWord(l,['charger'])) return 'Charger';
  var m = q.match(/(?:my|the|our)\s+([a-z]+(?:\s+[a-z]+)?)\s+(?:is|has|was|is not|has stopped|not|does|doesnt|doesn't|won't|wont|can't|cant|stopped)/i);
  if(m){ var cand=m[1].toLowerCase().trim(); var bad=['name','location','phone','problem','question','friend','brother','sister','mother','father','car','house','fridge','tv']; if(bad.indexOf(cand)===-1 && cand.length>2){ return cand.split(' ').map(function(w){return w.charAt(0).toUpperCase()+w.slice(1);}).join(' '); } }
  return "";
}
function getInfo(a,l){
  var low=a.toLowerCase();
  if(low.indexOf('car radio')!==-1||low==='radio') return "<b>Car Radio:</b><br><b>Likely cause:</b> No sound is often damaged speaker, faulty wiring, or amplifier IC. No power is often fuse, wiring, or power IC. Distorted sound is often speaker or output IC.<br><b>What to do:</b> Check fuse and wiring, do not keep volume up if distorting.<br><b>Estimate: Ksh 700 - 2,500.</b>";
  if(low.indexOf('home theatre')!==-1) return "<b>Home Theatre:</b><br><b>Likely cause:</b> No sound from some speakers is often wiring, settings, or amplifier channel.<br><b>Estimate: Ksh 800 - 3,000.</b>";
  if(low.indexOf('computer')!==-1) return "<b>Computer / Laptop:</b><br><b>Likely cause:</b> Not switching on is often faulty charger, battery, RAM, or power button. Black screen is often RAM or display. Slow is often full storage or virus.<br><b>What to do:</b> Remove charger, hold power button 15 seconds, try again with charger.<br><b>Estimate: Ksh 800 - 3,500.</b>";
  if(low.indexOf('woofer')!==-1||low.indexOf('amplifier')!==-1) return "<b>Amplifier / Woofer:</b><br><b>Likely cause:</b> Humming or distorting is usually damaged speaker coil, faulty capacitor, or amplifier board. No sound is often fuse, output IC, or wiring.<br><b>What to do:</b> Turn volume down and switch it off.<br><b>Estimate: Ksh 800 - 3,000.</b>";
  if(low==='tv') return "<b>TV:</b><br><b>Likely cause:</b> Sound but no picture often means backlight failure. No power often means power board failure. No sound often means speaker or audio IC.<br><b>What to do:</b> Unplug for 1 minute, try again.<br><b>Estimate: Ksh 1,200 - 4,000.</b>";
  if(low==='microwave') return "<b>Microwave:</b><br><b>Likely cause:</b> Not turning on is often fuse or door switch. Running but no heat is often magnetron.<br><b>Safety:</b> Do not open it yourself. It stores high voltage even when unplugged.<br><b>Estimate: Ksh 1,000 - 3,000.</b>";
  if(low==='fridge') return "<b>Fridge:</b><br><b>Likely cause:</b> Not cooling is often low gas, blocked fan, or faulty thermostat. Noise is often fan or compressor. Leaking is often blocked drain.<br><b>What to do:</b> Keep door closed so food stays cold.<br><b>Estimate: Ksh 1,500 - 3,500.</b>";
  if(low.indexOf('washing')!==-1) return "<b>Washing Machine:</b><br><b>Likely cause:</b> Not spinning is often belt, pump or lid switch. Not draining is often blocked pump filter. Shaking is often uneven load.<br><b>Estimate: Ksh 1,200 - 3,500.</b>";
  if(low.indexOf('cooker')!==-1) return "<b>Cooker / Oven:</b><br><b>Likely cause:</b> Burner not lighting is often blocked nozzle or faulty igniter.<br><b>Safety:</b> If you smell gas, turn off gas, open windows, do not switch on lights.<br><b>Estimate: Ksh 1,000 - 3,000.</b>";
  if(low==='decoder') return "<b>Decoder:</b><br><b>Likely cause:</b> No signal is often dish alignment or cable. No power is often power supply.<br><b>Estimate: Ksh 500 - 1,500.</b>";
  var p="";
  if(l.indexOf('no sound')!==-1||l.indexOf('no audio')!==-1) p="<b>Likely cause:</b> No sound is often damaged speaker, faulty wiring, or audio IC.<br><b>What to do:</b> Check volume, cables and speakers.<br>";
  else if(l.indexOf('not working')!==-1||l.indexOf('not turning')!==-1||l.indexOf('not switching')!==-1||l.indexOf('no power')!==-1||l.indexOf('dead')!==-1) p="<b>Likely cause:</b> No power / not turning on is often faulty power supply, fuse, cable, or power switch.<br><b>What to do:</b> Try a different socket, check cable and fuse.<br>";
  else if(l.indexOf('noise')!==-1||l.indexOf('loud')!==-1||l.indexOf('humming')!==-1||l.indexOf('distort')!==-1) p="<b>Likely cause:</b> Noise or distortion is often worn fan, motor, or damaged speaker.<br><b>What to do:</b> Switch it off, do not keep using it loud.<br>";
  else if(l.indexOf('not cooling')!==-1||l.indexOf('not cold')!==-1) p="<b>Likely cause:</b> Not cooling is often low gas, blocked fan, or faulty thermostat.<br>";
  else if(l.indexOf('not heating')!==-1||l.indexOf('no heat')!==-1) p="<b>Likely cause:</b> Not heating is often faulty element, magnetron, or thermostat.<br>";
  else if(l.indexOf('leak')!==-1) p="<b>Likely cause:</b> Leaking is often blocked drain, worn seal, or cracked pipe.<br><b>What to do:</b> Switch off and unplug if water is near electricity.<br>";
  else if(l.indexOf('spark')!==-1||l.indexOf('smell')!==-1||l.indexOf('burn')!==-1) p="<b>Safety:</b> Switch it off and unplug immediately. Do not use it again until technician checks it.<br><b>Likely cause:</b> Sparking or burning smell is often damaged wiring or short circuit.<br>";
  else p="<b>Likely cause:</b> This needs a physical check. Technician will test it and tell you exact fault and price before starting.<br>";
  return "<b>"+a+":</b><br>"+p+"<b>Estimate: Ksh 500 - 2,500.</b> Yes, we repair it.";
}
function ask(){
  var input=document.getElementById('q'); var q=input.value.trim(); if(!q){ input.focus(); return; }
  showMsg(q,'me'); input.value='';
  var l=q.toLowerCase(); var ans="";
  var nm=q.match(/^(?:my name is|i am|i'm|im|call me|i am called)\s+([a-zA-Z]+)/i);
  if(nm){ var nn=nm[1].charAt(0).toUpperCase()+nm[1].slice(1).toLowerCase(); if(nn.length>1){ memName=nn; saveMem(); showMsg("Nice to meet you, "+memName+"! What is broken?",'bot'); return; } }
  if(hasPhrase(l,'i live in')||hasPhrase(l,'i stay in')||hasPhrase(l,'my location is')||hasPhrase(l,'i am from')){
    var loc=q.replace(/.*(live in|stay in|my location is|i am from)/i,'').trim(); if(loc){ memLocation=loc; saveMem(); showMsg("Got it"+(memName? ", "+memName:"")+". We do home visits in "+loc+" and many other areas. What is broken?",'bot'); return; }
  }
  if(hasPhrase(l,'what is my name')){ showMsg(memName? "Your name is "+memName+"." : "You have not told me your name yet. What is your name?",'bot'); return; }
  if(hasPhrase(l,'who are you')||hasPhrase(l,'what are you')){ showMsg("I am the Ruaka Electronics assistant. I help you understand what is wrong with your appliance, how much it may cost, and how to book a repair. What is broken?",'bot'); return; }
  var found=detectAppliance(q,l);
  if(found && !hasPhrase(l,'what do you') && !hasPhrase(l,'how much') && !hasPhrase(l,'how long') && !hasPhrase(l,'where') && !hasPhrase(l,'book')){ memAppliance=found; memProblem=q; saveMem(); var s2=document.getElementById('device'); if(s2){ var opts=[]; for(var oi=0;oi<s2.options.length;oi++) opts.push(s2.options[oi].value); if(opts.indexOf(found)!==-1) s2.value=found; } }
  var current=found||memAppliance;
  if(hasPhrase(l,'what do you do')||hasPhrase(l,'what do you repair')||hasPhrase(l,'what can you')){
    if(found && hasPhrase(l,'do you repair')){ showMsg("Yes, we repair "+found+". "+getInfo(found,l)+"<br><br>Do you want to book it?"+toTech(found),'bot'); return; }
    ans="We repair Fridges, TVs, Woofers, Amplifiers, Microwaves, Computers, Washing Machines, Cookers, Car Radios, Home Theatres, Decoders, Blenders, Irons, Fans, Kettles and almost all home electronics. We are at Old Ruaka Road, Ruaka. Home service in Ruaka, Banana, Ndenderu, Two Rivers, Kiambu Road, Gachie, Westlands, Kangemi, Kinoo, Kikuyu and many others. What is broken?";
  }
  else if(hasPhrase(l,'how much')||hasWord(l,['price','cost','charge','fee'])){
    if(current){ ans="For your "+current+":<br>"+getInfo(current,l)+"<br><br>This is an estimate only. Technician will confirm final price after checking it at Old Ruaka Road or at your home, before starting."+toTech(current); }
    else { ans="Tell me which appliance it is, for example: My car radio is not working. Then I will give you the price. Starting prices: Fridge from 1,500, TV from 1,200, Woofer from 800, Microwave from 1,000, Computer from 800, Car Radio from 700, Small appliances from 500."+toTech(""); }
  }
  else if(hasPhrase(l,'how long')||hasWord(l,['duration'])||hasPhrase(l,'take long')){
    ans="Most repairs take 1 to 2 hours at your home if the part is available"+(current? " for your "+current:"")+". If we need to order a part, it can take 1 to 2 days. Technician will tell you after checking."+toTech(current);
  }
  else if(hasWord(l,['where','location','address'])||hasPhrase(l,'where are you')){
    ans="We are located at Old Ruaka Road, Ruaka Town. Come and visit us, or we come to you. We serve Ruaka, Banana, Ndenderu, Two Rivers, Kiambu Road, Gachie, Westlands, Kangemi, Kinoo, Kikuyu, Runda, Gigiri, Village Market and many others. Call 0797 300 175."+toTech(current);
  }
  else if(hasPhrase(l,'open')||hasPhrase(l,'close')||hasPhrase(l,'working hours')||hasPhrase(l,'what time')||hasPhrase(l,'are you open')){
    ans="We are open daily from 8am to 8pm at Old Ruaka Road. WhatsApp us on 0797 300 175 for same-day visit if technician is available."+toTech(current);
  }
  else if(hasWord(l,['home','visit','come'])){
    ans="Yes, we do home service. You do not need to bring heavy appliances."+(memLocation? " We can come to "+memLocation+"." : " Tell me your location and we will arrange.")+" For small items like car radio, you can also bring it to Old Ruaka Road."+toTech(current);
  }
  else if(hasWord(l,['payment','pay','mpesa','cash'])){
    ans="You can pay with M-Pesa or cash after repair is done and tested. You only pay the price confirmed before repair starts.";
  }
  else if(hasWord(l,['diagnosis','diagnose'])){
    ans="Diagnosis is FREE if you repair with us. Technician will check your appliance"+(current? " - your "+current:"")+" and tell you problem and price before starting."+toTech(current);
  }
  else if(hasPhrase(l,'spare')||hasWord(l,['parts','part'])){
    ans="Yes, we help you get spare parts. Technician will tell you which part is needed and cost before replacing it."+toTech(current);
  }
  else if(hasPhrase(l,'guarantee')||hasPhrase(l,'warranty')){
    ans="We stand behind our work. If the same problem comes back soon after repair, contact us on 0797 300 175 and we will check it."+toTech(current);
  }
  else if(hasPhrase(l,'book')||hasPhrase(l,'need repair')||hasPhrase(l,'want repair')||hasPhrase(l,'fix it')){
    var bk="Great! Let's book it."; if(current) bk+=" Appliance: "+current+"."; if(memName) bk+=" Name: "+memName+"."; else bk+=" What is your name?"; if(memLocation) bk+=" Location: "+memLocation+"."; else bk+=" Where are you located?"; bk+=" Fill the Book a Repair form below and press Send to WhatsApp.";
    showMsg(bk,'bot');
    if(memName) document.getElementById('name').value=memName; if(memLocation) document.getElementById('loc').value=memLocation; if(memProblem) document.getElementById('problem').value=memProblem;
    document.getElementById('book').scrollIntoView({behavior:'smooth'}); return;
  }
  else if(hasWord(l,['hello','hi','hey','hallo','morning','afternoon','evening'])){
    ans="Hello"+(memName? " "+memName:"")+"! How can I help you today? Tell me what is broken and what it is doing. We are at Old Ruaka Road.";
  }
  else if(hasPhrase(l,'thank')||hasWord(l,['thanks','asante'])){
    ans="You are welcome"+(memName? " "+memName:"")+"! If you need anything else, just ask. To book, fill the form below or 【entity-WhatsApp¦canonical_name=WhatsApp】 0797 300 175.";
  }
  else if(hasPhrase(l,'bye')||hasWord(l,['goodbye'])){
    ans="Goodbye"+(memName? " "+memName:"")+"! Karibu tena.";
  }
  else if(hasPhrase(l,'ok')||hasPhrase(l,'okay')||hasPhrase(l,'sawa')){
    ans="Sawa"+(memName? " "+memName:"")+". What do you want to do next? Do you want me to help you book the repair, or do you want the price?"+toTech(current);
  }
  else if(current){
    ans=getInfo(current,l)+"<br><br>Do you want to book it? Tell me your name and location, or fill the Book a Repair form below."+toTech(current);
  }
  else {
    ans="Yes, we can help with that. For an accurate answer, it is best the technician sees it. Please send him a photo or video and he will tell you the exact fault and price."+toTech("");
  }
  showMsg(ans,'bot');
}
var qInput=document.getElementById('q');
if(qInput){ qInput.addEventListener('keypress',function(e){ if(e.key==='Enter'){ e.preventDefault(); ask(); } }); }
function sendWhatsApp(){
  var d=document.getElementById('device').value||memAppliance||'Not specified';
  var p=document.getElementById('problem').value||memProblem||'Not specified';
  var n=document.getElementById('name').value||memName||'Customer';
  var ph=document.getElementById('phone').value||'';
  var l=document.getElementById('loc').value||memLocation||'Ruaka';
  var w=document.getElementById('when').value||'Today';
  if(n!=='Customer') memName=n; if(l!=='Ruaka') memLocation=l; saveMem();
  var text='Hi Ruaka Electronics! I need a Repair.%0A%0A*Appliance:* '+d+'%0A*Problem:* '+p+'%0A*Name:* '+n+'%0A*Phone:* '+ph+'%0A*Location:* '+l+'%0A*When:* '+w;
  window.open('https://wa.me/254797300175?text='+text,'_blank');
}
  </script>
